<app-auth-shell [platform]="platform" [title]="platform ? 'Sign in to platform administration' : 'Sign in'">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="d-grid gap-3">
    <div>
      <label for="email" class="form-label">Username</label>
      <div class="input-group">
        <span class="input-group-text">@</span>
        <input type="text" name="username" id="email" formControlName="email" class="form-control" data-testid="login-email" autocomplete="username" required>
      </div>
    </div>

    <div>
      <app-auth-password label="Password" inputId="password" [control]="$any(form.controls['password'])" testid="login-password" autocomplete="current-password"></app-auth-password>
    </div>

    <div class="alert alert-danger py-2 mb-0" role="alert" data-testid="login-error" *ngIf="error && !form.controls['password'].dirty">
      Invalid credentials. Check your username and password.
    </div>

    <button class="btn btn-primary" type="submit" data-testid="login-submit" [disabled]="!form.valid">{{platform ? 'Sign in to platform' : 'Sign in'}}</button>

    <div class="text-center small">
      <a routerLink="/changepassword" [queryParams]="platform ? {scope: 'platform'} : null" data-testid="login-changepw-link">Change password</a>
    </div>
  </form>
</app-auth-shell>
