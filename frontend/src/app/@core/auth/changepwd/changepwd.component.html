<app-auth-shell [platform]="platform" title="Change your password">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="d-grid gap-3">
    <div>
      <label for="email" class="form-label">Username</label>
      <div class="input-group">
        <span class="input-group-text">@</span>
        <input type="text" name="username" id="email" formControlName="email" class="form-control" data-testid="cp-email" autocomplete="username" required>
      </div>
    </div>

    <div><app-auth-password label="Current password" inputId="password" [control]="$any(form.controls['password'])" testid="cp-current" autocomplete="current-password"></app-auth-password></div>

    <div>
      <app-auth-password label="New password" inputId="newpassword" [control]="$any(form.controls['newpassword'])" testid="cp-new" autocomplete="new-password">
        <div class="form-text" [class.text-danger]="newTooShort || sameAsCurrent" data-testid="cp-new-hint">
          At least {{minLength}} characters, and different from the current one.
        </div>
      </app-auth-password>
    </div>

    <div>
      <app-auth-password label="Confirm new password" inputId="confirmpassword" [control]="$any(form.controls['confirmpassword'])" testid="cp-confirm" autocomplete="new-password">
        <div class="form-text text-danger" *ngIf="mismatch" data-testid="cp-mismatch">The two passwords do not match.</div>
      </app-auth-password>
    </div>

    <div class="alert alert-danger py-2 mb-0" role="alert" data-testid="cp-error" *ngIf="error">{{error}}</div>
    <div class="alert alert-success py-2 mb-0" role="status" data-testid="cp-success" *ngIf="done">Your password is changed. You can sign in with it now.</div>

    <button class="btn btn-primary" type="submit" data-testid="cp-submit" [disabled]="!canSubmit || busy || done">Change password</button>

    <div class="text-center small">
      <a [routerLink]="loginLink" data-testid="cp-back">Back to sign in</a>
    </div>
  </form>
</app-auth-shell>
