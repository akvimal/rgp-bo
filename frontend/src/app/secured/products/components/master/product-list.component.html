    <p class="small text-muted mt-2 mb-0" data-testid="prod-intro">Every product the shop sells or has sold. Prices are set on the <a routerLink="/secure/products/price">Price</a> page.</p>
    <div class="page-toolbar mt-2">
        <div class="page-toolbar-main">
            <div class="d-flex">
                <div style="padding-right:.7em;">
                    <label class="form-label">Active</label>
                    <br>
                    <input type="checkbox" style="width:25px;height:25px;margin-top:.4em" [(ngModel)]="criteria.active" (change)="filter()">
                </div>
                <div style="padding-right:.5em">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" [(ngModel)]="criteria.title" (input)="filter()" placeholder="Product">
                </div>
                <app-props-form [entity]="'product'" [validate]="false" [default]="false" (updated)="propsUpdate($event)"></app-props-form>
            </div>
        </div>
        <div class="page-toolbar-actions">
            <a *isAuth="'products.add'" class="btn btn-primary" role="button" [routerLink]="['../new']" data-testid="prod-add">Add New</a>
        </div>
    </div>
    <div class="row">
            <div class="col-12">
            <p-table [value]="products" [resizableColumns]="true" columnResizeMode="expand" 
                [paginator]="true" [rows]="25" [showCurrentPageReport]="true" styleClass="p-datatable-gridlines p-datatable-sm mt-4" [loading]="loading"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" 
                [rowsPerPageOptions]="[25,50,100]">
               
                <ng-template pTemplate="header">
                    <tr>
                        <!-- <th pSortableColumn="id"><div class="th-bar"><span class="th-label">ID</span><p-sortIcon field="id"></p-sortIcon></div></th>   -->
                        <th pSortableColumn="category"><div class="th-bar"><span class="th-label">Category</span><p-sortIcon field="category"></p-sortIcon></div></th>
                        <!-- <th pSortableColumn="code"><div class="th-bar"><span class="th-label">Code</span><p-columnFilter type="text" field="code" display="menu"></p-columnFilter><p-sortIcon field="code"></p-sortIcon></div></th>   -->
                        <!-- <th pSortableColumn="hsn"><div class="th-bar"><span class="th-label">HSN</span><p-columnFilter type="text" field="hsn" display="menu"></p-columnFilter><p-sortIcon field="hsn"></p-sortIcon></div></th> -->
                        <th pSortableColumn="title"><div class="th-bar"><span class="th-label">Product</span><p-columnFilter type="text" field="title" display="menu"></p-columnFilter><p-sortIcon field="title"></p-sortIcon></div></th>
                        <th>Properties</th>
                        <!-- <th pSortableColumn="pack"><div class="th-bar"><span class="th-label">Pack</span><p-sortIcon field="pack"></p-sortIcon></div></th> -->
                        <!-- <th pSortableColumn="brand"><div class="th-bar"><span class="th-label">Brand</span><p-columnFilter type="text" field="brand" display="menu"></p-columnFilter><p-sortIcon field="brand"></p-sortIcon></div></th> -->
                        <!-- <th pSortableColumn="mfr"><div class="th-bar"><span class="th-label">MFR</span><p-columnFilter type="text" field="mfr" display="menu"></p-columnFilter><p-sortIcon field="mfr"></p-sortIcon></div></th> -->
                        <th pSortableColumn="updatedon"><div class="th-bar"><span class="th-label">Latest</span><p-sortIcon field="updatedon"></p-sortIcon></div></th>  
                        <th class="text-center">Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-product>
                    <tr>
                        <!-- <td>{{product.id}}</td> -->
                        <td>{{product.category}}</td>
                        <!-- <td>{{product.code}}</td> -->
                        <!-- <td>{{product.hsn}}</td> -->
                        <td>
                            <h6>{{product.title}} ({{product.pack}})</h6>
                        </td>
                        <td><app-props-print [props]="product.props"></app-props-print></td>
                        <!-- <td style="text-align: center;">{{product.pack}}</td> -->
                        <!-- <td>{{product.brand}}</td> -->
                        <!-- <td>{{product.mfr}}</td> -->
                        <td>{{product.updatedon | date : 'dd MMM yyyy'}}</td>
                        <td class="text-center">
                            <div class="grid-actions">
                                <a *ngIf="product.isActive" [routerLink]="['../edit', product.id]" title="Edit">
                                    <i class="bi bi-pencil-square text-primary"></i>
                                </a>
                                <a *ngIf="product.isActive" (click)="changeActive(product.id, false, product.title)" title="Deactivate" data-testid="prod-deactivate">
                                    <i class="bi bi-slash-circle text-secondary"></i>
                                </a>
                                <a *ngIf="!product.isActive" (click)="changeActive(product.id, true)" title="Activate">
                                    <i class="bi bi-check-circle text-success"></i>
                                </a>
                                <a *ngIf="!product.isActive" (click)="archive(product)" title="Archive">
                                    <i class="bi bi-archive text-secondary"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr><td colspan="5" class="text-center text-muted py-4" data-testid="prod-empty">{{loading ? 'Loading...' : 'No products match.'}}</td></tr>
                </ng-template>
            </p-table>
        </div>
    </div>
