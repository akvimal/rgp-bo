<div class="page-toolbar justify-content-end">
    <a *isAuth="'users.add'" class="btn btn-primary" role="button" [routerLink]="['../new']" data-testid="user-add">Add New</a>
</div>

<table *isAuth="'users.read'" class="table table-bordered mt-3">
    <thead>
        <tr>
            <th *isAuth="'users.read$fullname'" scope="col">Full Name</th>
            <th *isAuth="'users.read$email'" scope="col">Email</th>
            <th *isAuth="'users.read$phone'" scope="col">Phone</th>
            <th scope="col">Role</th>
            <th *isAuth="'businesses'" scope="col">Business</th>
            <th scope="col">Store</th>
            <th *isAuth="'hr.view'" scope="col">Staff record</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let p of users" data-testid="user-row" [attr.data-user-email]="p.email">
            <td *isAuth="'users.read$fullname'">{{p.fullname}}</td>
            <td *isAuth="'users.read$email'" data-testid="user-row-email">{{p.email}}</td>
            <td *isAuth="'users.read$phone'">{{p.phone}}</td>
            <td data-testid="user-row-role">{{p.role}}</td>
            <td *isAuth="'businesses'" data-testid="user-row-business">{{p.business || '—'}}</td>
            <td>{{p.store || '—'}}</td>
            <td *isAuth="'hr.view'" data-testid="user-row-staff">
                <a *ngIf="staffOf(p.id) as st; else noStaff" routerLink="/secure/hr/staff" [queryParams]="{staff: st.id}" [attr.data-testid]="'user-staff-open'">{{st.emp_code}}{{st.designation ? ' · ' + st.designation : ''}}{{st.status !== 'ACTIVE' ? ' (left)' : ''}}</a>
                <ng-template #noStaff><a routerLink="/secure/hr/staff" [queryParams]="{user: p.id}" data-testid="user-staff-add">Add as staff</a></ng-template>
            </td>
            <td>
                <div class="grid-actions">
                    <a *isAuth="'users.edit'" [routerLink]="['../edit', p.id]" title="Edit"><i class="bi bi-pencil-square text-primary"></i></a>
                    <a *isAuth="'users.delete'" (click)="delete(p)" title="Delete"><i class="bi bi-trash text-danger"></i></a>
                </div>
            </td>
        </tr>
    </tbody>
</table>
