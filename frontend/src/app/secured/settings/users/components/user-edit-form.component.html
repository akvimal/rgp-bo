<div class="card">
    <div class="card-body">
      <h5 class="card-title">Edit User</h5>

      <!-- Multi Columns Form -->
      <form class="row g-3" [formGroup]="form" (ngSubmit)="onSave()">
        <div class="col-md-4" *isAuth="'users.edit$fullname'">
          <label for="fullname" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="fullname" formControlName="fullname">
        </div>
        <div class="col-md-4" *isAuth="'users.edit$email'">
          <label for="email" class="form-label">Email</label>
          <input type="text" class="form-control" id="email" formControlName="email">
        </div>
        <div class="col-md-4" *isAuth="'users.edit$phone'">
          <label for="phone" class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone" formControlName="phone">
        </div>
        <div class="col-md-4" *isAuth="'users.edit$location'">
          <label for="location" class="form-label">Location</label>
          <input type="text" class="form-control" id="location" formControlName="location">
        </div>
        <div class="col-md-4" *isAuth="'users.edit$role'">
          <label for="role" class="form-label">Role</label>
          <select class="form-control" id="role" formControlName="roleid">
            <option *ngFor="let r of roles" [value]="r.id">{{r.name}}</option>
          </select>
        </div>
        <div class="col-md-4" *isAuth="'users.edit$businessid'">
          <label for="businessid" class="form-label">Business</label>
          <select class="form-control" id="businessid" formControlName="businessid">
            <option value="">Choose business</option>
            <option *ngFor="let b of businesses" [value]="b.id">{{b.name}}</option>
          </select>
        </div>
        <div class="col-md-12" *isAuth="'users.edit$storeids'">
          <label class="form-label">Assigned Stores</label>
          <div class="border rounded p-3">
            <div class="d-flex justify-content-end gap-2 mb-3">
              <button type="button" class="btn btn-sm btn-outline-secondary" (click)="selectAllStores()">Select all</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" (click)="clearAllStores()">Clear all</button>
            </div>
            <div class="row g-2">
              <div class="col-12 col-md-6 col-lg-4" *ngFor="let store of stores">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" [id]="'store-edit-' + store.id" [checked]="isStoreSelected(store.id)" (change)="toggleStore(store.id, $any($event.target).checked)">
                  <label class="form-check-label" [for]="'store-edit-' + store.id">
                    {{store.business?.name}} - {{store.location}}
                  </label>
                </div>
              </div>
            </div>
            <small class="text-muted d-block mt-2" *ngIf="!isManager">Leave all unchecked to allow access to all stores in {{currentUserBusinessName}}.</small>
              <small class="text-muted d-block mt-2" *ngIf="isManager" data-testid="user-f-manager-note">Choose the store or stores this person works in. You can only choose stores you work in.</small>
          </div>
        </div>
       
        <div class="col-md-12" *ngIf="showDetails" data-testid="user-e-details">
          <label class="form-label">Staff details <span class="text-muted small">(kept on the staff record)</span></label>
          <div class="border rounded p-3"><app-staff-details-fields [model]="details" [pharmacist]="pharmacistApplies"></app-staff-details-fields></div>
          <div class="alert alert-warning py-2 mt-2 mb-0" *ngIf="detailsError" data-testid="user-e-details-error">{{detailsError}}</div>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary m-2" [disabled]="!form.valid">Submit</button>
          <button type="button" (click)="gotoList()" class="btn btn-outline-secondary m-2">Cancel</button>
        </div>
      </form><!-- End Multi Columns Form -->

    </div>
  </div>
