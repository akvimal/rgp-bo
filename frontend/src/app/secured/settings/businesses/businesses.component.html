<div class="card mt-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h5 class="card-title mb-0">Businesses</h5>
      <div class="small text-muted">Root admin only. Use this to create top-level businesses before adding stores.</div>
    </div>

    <div class="row g-2 mt-3">
      <div class="col-12 col-md-6">
        <label class="form-label">Business Name</label>
        <input class="form-control" [(ngModel)]="form.name" placeholder="e.g. RGP Pharmacy">
      </div>
      <div class="col-6 col-md-3 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="businessActive" [(ngModel)]="form.isActive">
          <label class="form-check-label" for="businessActive">Active</label>
        </div>
      </div>
      <div class="col-6 col-md-3 d-flex align-items-end">
        <button class="btn btn-primary w-100" type="button" [disabled]="saving || !form.name" (click)="save()">
          {{saving ? 'Saving...' : (form.id ? 'Update Business' : 'Add Business')}}
        </button>
      </div>
    </div>

    <div class="table-responsive mt-3">
      <table class="table table-sm table-striped align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let business of businesses">
            <td>
              {{business.name}}
              <div class="small text-warning mt-1" *ngIf="!hasBusinessHead(business)">
                No Business Head yet &mdash; <a routerLink="/secure/settings/users/new">create one and link it to this business</a>. They'll then be able to add stores and users of their own.
              </div>
            </td>
            <td>
              <span class="badge bg-success" *ngIf="business.isActive && !business.isArchived">Active</span>
              <span class="badge bg-secondary" *ngIf="!business.isActive || business.isArchived">Archived</span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2" type="button" (click)="edit(business)">Edit</button>
              <button class="btn btn-sm btn-outline-danger" type="button" (click)="archive(business)">Archive</button>
            </td>
          </tr>
          <tr *ngIf="!businesses?.length">
            <td colspan="3" class="text-center text-muted py-3">No businesses yet.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="message" class="alert alert-danger mt-3">{{message}}</div>
  </div>
</div>
