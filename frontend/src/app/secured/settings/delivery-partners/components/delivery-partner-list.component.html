<div class="row">
    <div class="col-12 mt-2">
        <a [routerLink]="['../new']"><button type="submit" class="btn btn-primary">Add New</button></a>
    </div>
    <div class="col-12">
        <p-table #dt1 [value]="partners" [resizableColumns]="true" columnResizeMode="expand"
            [paginator]="true" [rows]="10" [showCurrentPageReport]="true" styleClass="p-datatable-gridlines mt-4"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            [rowsPerPageOptions]="[10,25,50]">
            <ng-template pTemplate="header">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Contact</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-partner>
                <tr>
                    <td>{{partner.id}}</td>
                    <td>{{partner.name}}</td>
                    <td>{{partner.contactname}}</td>
                    <td>{{partner.contactphone}}</td>
                    <td style="text-align: center;">
                        <h5>
                            <a [routerLink]="['../edit', partner.id]"><i class="bi bi-pencil-square text-primary"></i></a>&nbsp;&nbsp;
                            <a (click)="delete(partner.id)"><i class="bi bi-trash text-danger"></i></a>
                        </h5>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
