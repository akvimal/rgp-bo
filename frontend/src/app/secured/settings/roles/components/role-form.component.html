<div class="role-form">
  <div class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">{{form.value.id ? 'Edit Role' : 'New Role'}}</h5>

      <form [formGroup]="form" (ngSubmit)="onSave()">
        <div class="row g-3">
          <div class="col-md-5" *isAuth="'roles.add$name'">
            <label for="name" class="form-label">Role name</label>
            <input type="text" class="form-control" id="name" data-testid="role-f-name" formControlName="name" placeholder="e.g. Regional Manager">
          </div>
        </div>

        <hr class="my-4">

        <div class="d-flex align-items-center justify-content-between mb-3">
          <div>
            <h6 class="mb-0">Landing &amp; navigation</h6>
            <div class="small text-muted">What this role sees first, and whether the general dashboard is reachable.</div>
          </div>
        </div>
        <div class="row g-3 mb-2">
          <div class="col-md-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="dashboardAccess"
                [(ngModel)]="dashboardAccess" [ngModelOptions]="{standalone:true}" (change)="onDashboardAccessChange()">
              <label class="form-check-label" for="dashboardAccess">Can view the Dashboard</label>
            </div>
          </div>
          <div class="col-md-5">
            <label for="landingPath" class="form-label">Default page after login</label>
            <select class="form-select" id="landingPath" [(ngModel)]="landingPath" [ngModelOptions]="{standalone:true}" (change)="onLandingChange()">
              <option *ngFor="let opt of landingOptions" [value]="opt.value">{{opt.label}}</option>
            </select>
          </div>
        </div>

        <hr class="my-4">

        <div *ngFor="let group of groups" class="permission-group mb-4">
          <h6 class="permission-group-title">{{group}}</h6>

          <div class="permission-resource" *ngFor="let resource of resourcesInGroup(group)">
            <div class="permission-resource-header">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" [id]="'res-' + resource.key"
                  [attr.data-testid]="'role-f-res-' + resource.key"
                  [checked]="selection[resource.key]?.enabled"
                  (change)="toggleResource(resource, $any($event.target).checked)">
                <label class="form-check-label fw-semibold" [for]="'res-' + resource.key">{{resource.label}}</label>
              </div>
              <div class="small text-muted permission-resource-desc">{{resource.description}}</div>
            </div>

            <div class="permission-pages" *ngIf="selection[resource.key]?.enabled && resource.pathOptions">
              <div class="small text-muted mb-1">Pages</div>
              <div class="form-check form-check-inline" *ngFor="let page of resource.pathOptions">
                <input class="form-check-input" type="checkbox" [id]="'page-' + resource.key + '-' + page.key"
                  [checked]="isPageChecked(resource, page.key)"
                  (change)="togglePage(resource, page.key, $any($event.target).checked)">
                <label class="form-check-label small" [for]="'page-' + resource.key + '-' + page.key">{{page.label}}</label>
              </div>
            </div>

            <div class="permission-actions" *ngIf="selection[resource.key]?.enabled && !resource.bundle && !resource.presenceOnly">
              <div class="permission-action" *ngFor="let action of resource.actions">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" [id]="'act-' + resource.key + '-' + action.key"
                    [attr.data-testid]="'role-f-act-' + resource.key + '-' + action.key"
                    [checked]="selection[resource.key]?.actions?.[action.key]"
                    (change)="toggleAction(resource, action.key, $any($event.target).checked)">
                  <label class="form-check-label" [for]="'act-' + resource.key + '-' + action.key">{{action.label}}</label>
                </div>

                <div class="permission-properties" *ngIf="action.properties?.length && selection[resource.key]?.actions?.[action.key]">
                  <div class="form-check form-check-inline" *ngFor="let prop of action.properties">
                    <input class="form-check-input" type="checkbox" [id]="'prop-' + resource.key + '-' + action.key + '-' + prop.key"
                      [checked]="isPropertyChecked(resource, action.key, prop.key)"
                      (change)="toggleProperty(resource, action.key, prop.key, $any($event.target).checked)">
                    <label class="form-check-label small" [for]="'prop-' + resource.key + '-' + action.key + '-' + prop.key">{{prop.label}}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="permission-bundle-note text-muted small" *ngIf="selection[resource.key]?.enabled && resource.bundle">
              Full access granted &mdash; {{resource.bundleLabel}}.
            </div>
          </div>
        </div>

        <hr class="my-4">

        <div class="advanced-json mb-4">
          <button type="button" class="btn btn-sm btn-outline-secondary" (click)="toggleJsonView()">
            <i class="bi" [class.bi-code-slash]="!showJson" [class.bi-eye]="showJson"></i>
            {{showJson ? 'Hide advanced JSON' : 'Advanced: view / import raw JSON'}}
          </button>

          <div class="mt-3" *ngIf="showJson">
            <label class="form-label small text-muted">
              This is exactly what will be saved. Paste a different permissions array here and click Import to load it into the form above.
            </label>
            <textarea class="form-control font-monospace small json-editor" rows="14" [(ngModel)]="importText" [ngModelOptions]="{standalone:true}"></textarea>
            <div class="d-flex align-items-center gap-2 mt-2">
              <button type="button" class="btn btn-sm btn-secondary" (click)="applyImportedJson()">Import into form</button>
              <span class="text-danger small" *ngIf="importError">{{importError}}</span>
            </div>
          </div>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary m-2" data-testid="role-f-submit" [disabled]="!form.valid">Submit</button>
          <button type="button" *ngIf="!form.get('id')?.value" (click)="reset()" class="btn btn-outline-secondary m-2">Reset</button>
          <button type="button" (click)="gotoList()" class="btn btn-outline-secondary m-2">Cancel</button>
        </div>
      </form>

    </div>
  </div>
</div>
