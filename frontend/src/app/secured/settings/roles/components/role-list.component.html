<div class="page-toolbar justify-content-end">
    <a *isAuth="'roles.add'" class="btn btn-primary" role="button" [routerLink]="['../new']" data-testid="role-add">Add New</a>
</div>
<table *isAuth="'roles.read'" class="table table-bordered mt-3">
    <thead>
        <tr>
            <th *isAuth="'roles.read$name'" scope="col">Name</th>
            <th *isAuth="'roles.read$permissions'" scope="col">Permissions</th>
            <th scopr="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let p of visibleRoles" data-testid="role-row" [attr.data-role-name]="p.name">
            <td *isAuth="'roles.read$name'">{{p.name}}</td>
            <td *isAuth="'roles.read$permissions'">
                <span class="badge bg-light text-dark border me-1 mb-1" *ngFor="let label of p.resourceLabels">{{label}}</span>
                <span class="text-muted small" *ngIf="!p.resourceLabels?.length">No permissions granted</span>
            </td>
            <td>
                <div class="grid-actions">
                    <a *isAuth="'roles.edit'" [routerLink]="['../edit', p.id]" title="Edit"><i class="bi bi-pencil-square text-primary"></i></a>
                    <a *isAuth="'roles.delete'" [hidden]="p.builtin" (click)="delete(p)" title="Delete"><i class="bi bi-trash text-danger"></i></a>
                </div>
            </td>
        </tr>
    </tbody>
</table>
<p class="small text-muted mt-2" *ngIf="unusedCount" data-testid="roles-unused">
    {{unusedCount}} role{{unusedCount === 1 ? ' is' : 's are'}} for ways of running a shop that nobody uses yet (Owner-operator, Counter, Personal).
    <a href="javascript:void(0)" (click)="showUnused = !showUnused" data-testid="roles-unused-toggle">{{ showUnused ? 'Hide them' : 'Show them' }}</a>
</p>
