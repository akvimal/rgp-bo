<div class="hist-empty" *ngIf="loading && documents.length == 0">Loading documents...</div>
<div class="hist-empty" *ngIf="!loading && documents.length == 0" data-testid="doc-none">
    <i class="bi bi-folder2-open"></i>No documents yet. Upload a prescription, ID proof or other paper to keep it with this customer.
</div>
<div class="hist-docs" *ngIf="documents.length > 0">
    <div>
        <div class="hist-toolbar">
            <button type="button" class="btn btn-primary btn-sm" [disabled]="selectedCount === 0" (click)="copySelectedItem()" data-testid="doc-copy">
                <i class="bi bi-plus-circle me-1"></i>{{copyLabel}} ({{selectedCount}})
            </button>
            <button type="button" class="btn btn-outline-danger btn-sm" [disabled]="selectedCount === 0" (click)="deleteSelectedItem()" data-testid="doc-delete">
                <i class="bi bi-trash me-1"></i>Delete
            </button>
        </div>
        <div class="hist-doc" *ngFor="let d of documents" [class.active]="document?.id === d.id" data-testid="doc-item">
            <input type="checkbox" class="form-check-input mt-1" (change)="selectDocument(d.id,$event)" [checked]="d.selected" [attr.aria-label]="'Tick ' + title(d)">
            <i class="bi" [ngClass]="icon(d)"></i>
            <button type="button" class="hist-doc-body" (click)="viewDoc(d.id)">
                <div class="hist-doc-title">{{title(d)}}</div>
                <div class="hist-doc-meta"><span class="badge bg-light text-dark border" *ngIf="d.category">{{d.category}}</span><span>{{d.createdon | date : 'dd MMM yyyy'}}</span></div>
                <app-obj-print [obj]="d.docprops" [json]="true"></app-obj-print>
            </button>
        </div>
    </div>
    <app-document-viewer *ngIf="document" [path]="document.path" [name]="title(document)"></app-document-viewer>
</div>
