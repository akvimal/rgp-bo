    <div class="row mt-2">
      <div class="col-12">
            <p-table #dt2 [value]="quantities" [resizableColumns]="true" columnResizeMode="expand" 
            [paginator]="true" [rows]="10" [showCurrentPageReport]="true" styleClass="p-datatable-gridlines mt-4"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" 
                [rowsPerPageOptions]="[10,25,50]">
                <ng-template pTemplate="header">
                    <tr>
                      <!-- <th pSortableColumn="itemid">ID
                          <p-columnFilter type="text" field="itemid" display="menu"></p-columnFilter>
                          <p-sortIcon field="itemid"></p-sortIcon>
                      </th> -->
                      <th pSortableColumn="title">Product
                          <p-columnFilter type="text" field="title" display="menu"></p-columnFilter>
                          <p-sortIcon field="title"></p-sortIcon>
                      </th>
                      <th pSortableColumn="qty">Qty
                        <p-sortIcon field="qty"></p-sortIcon>
                    </th>
                    <!-- <th pSortableColumn="price">Price
                      <p-sortIcon field="price"></p-sortIcon>
                  </th> -->
                    <th pSortableColumn="date">Date
                        <p-columnFilter type="date" field="date" display="menu"></p-columnFilter>
                        <p-sortIcon field="date"></p-sortIcon>
                    </th>
  
                      <th>Reason
                        <p-columnFilter type="text" field="reason" display="menu"></p-columnFilter>
                          <!-- <p-sortIcon field="reason"></p-sortIcon> -->
                      </th>
                      <th pSortableColumn="status">Status
                        <p-sortIcon field="status"></p-sortIcon>
                      </th>
                      <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-i>
                    <tr data-testid="stk-adjust-row" [attr.data-adj-id]="i.id">
                      <!-- <td>{{i.itemid}}</td> -->
                        <td>
                            <p class="m-0">{{i.title}}</p>
                            <span class="batch">{{i.batch}}/{{i.expdate | date :'MMM-yy'}}</span>

                        </td>
                        <td>{{i.qty}}</td>
                        <!-- <td style="text-align: right;">{{i.price}}</td> -->
                        <td>{{i.date | date : 'dd/MM/yyyy'}}</td>
                        <td>{{i.reasoncode || i.reason}}
                          <h5 *ngIf="i.comments" style="float:left; margin-right: 0.3em;"><i class="bi bi-chat text-danger"></i>
                          </h5>
                        </td>
                        <td>
                          <span class="badge" [ngClass]="{'bg-warning text-dark': i.status === 'PENDING', 'bg-success': i.status === 'APPROVED', 'bg-secondary': i.status === 'REJECTED'}">{{i.status || 'APPROVED'}}</span>
                        </td>
                        <td>
                          <div class="grid-actions">
                            <button *ngIf="i.status === 'PENDING'" type="button" class="btn btn-sm btn-outline-success" (click)="approve(i)">Approve</button>
                            <button *ngIf="i.status === 'PENDING'" type="button" class="btn btn-sm btn-outline-danger" (click)="reject(i)">Reject</button>
                            <a (click)="edit(i)" title="Edit"><i class="bi bi-pencil text-primary"></i></a>
                            <a (click)="delete(i)" title="Delete"><i class="bi bi-trash text-danger"></i></a>
                          </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
      </div>
    </div>

<p-dialog header="Edit Stock Adjustment" [(visible)]="displayEditDialog" [modal]="true" [style]="{width: '30vw'}">
  <div class="row mt-2">
    <div class="col-12">
      <label class="col-form-label">Quantity</label>
      <input type="number" class="form-control" [(ngModel)]="editForm.qty">
    </div>
  </div>
  <div class="row mt-2">
    <div class="col-12">
      <label class="col-form-label">Reason</label>
      <select class="form-select" [(ngModel)]="editForm.reasoncode">
        <option value="">Select</option>
        <option *ngFor="let r of reasonOptions" [value]="r.value">{{r.label}}</option>
      </select>
    </div>
  </div>
  <div class="row mt-2">
    <div class="col-12">
      <label class="col-form-label">Comments</label>
      <textarea class="form-control" rows="2" [(ngModel)]="editForm.comments"></textarea>
    </div>
  </div>
  <div class="row mt-2" *ngIf="message">
    <div class="col-12 text-danger">{{message}}</div>
  </div>
  <p-footer>
    <button type="button" class="btn btn-outline-secondary" (click)="displayEditDialog = false">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="saveEdit()">Save</button>
  </p-footer>
</p-dialog>
