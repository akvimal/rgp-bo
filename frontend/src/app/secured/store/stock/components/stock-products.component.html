    <div class="row mt-2">
        <div class="col-12">
            <div class="d-flex gap-4">
                <div class="form-check">
                    <input class="form-check-input" id="stk-active" data-testid="stk-active" type="checkbox" [(ngModel)]="criteria.active" (change)="fetch()"/>
                    <label class="form-check-label" for="stk-active">Active</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" id="stk-available" data-testid="stk-available" type="checkbox" [(ngModel)]="criteria.available" (change)="fetch()"/>
                    <label class="form-check-label" for="stk-available">Available</label>
                </div> 
           <!-- <input class="form-conrol-input checkmark" type="checkbox" [(ngModel)]="criteria.expired" 
                (change)="fetch()"/>
            <label for="expired" style="margin:.3em;padding-bottom:.5em;font-size: larger;">Expired</label> -->
            <!-- <app-product-select (selected)="onProductSelect($event)"></app-product-select> -->
            </div>
        </div>
    </div>
    <div>
        <!-- <p-menu #menu [model]="items" [popup]="true"></p-menu>
        <p-button (click)="menu.toggle($event)" icon="pi pi-ellipsis-v"></p-button>
        </div> -->
    <div class="row mt-2">
        <div class="col-6">
            <p-table [value]="products"
            [paginator]="true" [rows]="10" [showCurrentPageReport]="true" 
            styleClass="p-datatable-gridlines p-datatable-sm app-table"
                currentPageReportTemplate="{totalRecords} Products" 
                [rowsPerPageOptions]="[10,25,50]">
                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="title"><div class="th-bar"><span class="th-label">Product</span><p-columnFilter type="text" field="title" display="menu"></p-columnFilter><p-sortIcon field="title"></p-sortIcon></div></th>
                        <th pSortableColumn="bin_location"><div class="th-bar"><span class="th-label">Location</span><p-columnFilter type="text" field="bin_location" display="menu"></p-columnFilter><p-sortIcon field="bin_location"></p-sortIcon></div></th>
                        <th pSortableColumn="last_sale_date"><div class="th-bar"><span class="th-label">Last</span><p-sortIcon field="last_sale_date"></p-sortIcon></div></th>
                        <th pSortableColumn="highest_customers" class="right"><div class="th-bar"><span class="th-label">Cust.</span><p-sortIcon field="highest_customers"></p-sortIcon></div></th>
                        <th class="right">Avg.<br>Sales</th>
                        <th class="right">High<br>Sales</th>
                        <th pSortableColumn="balance" class="right"><div class="th-bar"><span class="th-label">Avail</span><p-sortIcon field="balance"></p-sortIcon></div></th>
                        <th pSortableColumn="level" class="right"><div class="th-bar"><span class="th-label">Level</span><p-sortIcon field="level"></p-sortIcon></div></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage"><tr><td colspan="8" class="text-center text-muted py-3">No products match.</td></tr></ng-template>
                <ng-template pTemplate="body" let-i>
                    <tr class="row-hover" [ngClass]="{'low': i.level < 20}" (click)="openData(i.id)">
                        <td>
                            
                            <!-- <a (click)="menu.toggle($event)">
                                <i class="bi bi-trash" style="color:gray"></i>
                            </a> -->

                            {{i.title}}</td>
                        <td>{{i.bin_location}}</td>
                        <td>{{i.last_sale_date | date : 'MM/yy'}}</td>
                        <!-- <td>{{i.average_customers | number:'1.0-0'}}</td> -->
                        <td class="right">{{i.highest_customers}}</td>
                        <td class="right">{{i.average_sales | number:'1.0-0'}}</td>
                        <td class="right">{{i.highest_sales}}</td>
                        <td class="right"><strong>{{i.balance}}</strong></td>
                        <td class="right">{{i.level}}</td>
                    </tr>
                </ng-template>
            </p-table>    
        </div>
        <div class="col-6">
            <router-outlet></router-outlet>
        </div>
    </div>
