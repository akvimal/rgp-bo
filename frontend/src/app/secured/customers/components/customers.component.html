<div class="pagetitle">
  <h1>Customers</h1>
</div>
<a [routerLink]="['../new']"><button type="submit" class="btn btn-primary">Add New</button></a>

<div class="d-flex align-items-center gap-2 mt-4">
  <label for="segmentFilter" class="small text-muted mb-0">Buying pattern</label>
  <select id="segmentFilter" class="form-select form-select-sm w-auto" data-testid="cust-segment-filter"
    (change)="dt.filter($any($event.target).value, 'segment', 'equals')">
    <option value="">All customers</option>
    <option *ngFor="let sg of segments" [value]="sg">{{sg}}</option>
  </select>
  <span class="small text-muted">OTC / Chronic only = every bill line was OTC or a chronic medicine. "Other" includes products not yet categorised.</span>
</div>

<p-table #dt [value]="customers" [resizableColumns]="true" columnResizeMode="expand" 
[paginator]="true" [rows]="10" [showCurrentPageReport]="true" styleClass="p-datatable-gridlines mt-2"
currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" 
[rowsPerPageOptions]="[10,25,50]">
<ng-template pTemplate="header">

    <tr>
      <!-- <th scope="col">ID</th> -->
      <th pSortableColumn="name" scope="col">Name
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter type="text" field="name" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="mobile" scope="col">Mobile
        <p-sortIcon field="mobile"></p-sortIcon>
        <p-columnFilter type="text" field="mobile" display="menu"></p-columnFilter>
      </th>
      <!-- <th  pSortableColumn="email" scope="col">Email
        <p-sortIcon field="email"></p-sortIcon>
        <p-columnFilter type="text" field="email" display="menu"></p-columnFilter>
      </th> -->
      <!-- <th>Address</th> -->
      <!-- <th>History</th>
      <th>Recent Visit</th> -->
      <!-- <th scope="col">Area</th> -->
      <!-- <th scope="col">Address</th> -->
      <th scope="col">Location</th>
      <th pSortableColumn="segment" scope="col">Buying pattern <p-sortIcon field="segment"></p-sortIcon></th>
      <!-- <th scope="col">Source Type</th> -->
      <!-- <th scope="col">Source Info</th> -->
      <!-- <th scope="col">Date</th> -->
      <th scope="col">Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-c>
    <tr>
      <!-- <td>{{c.id}}</td> -->
      <td>{{c.name}}</td>
      <td>{{c.mobile}}</td>
      <!-- <td>{{c.email}} | {{c.address}} | {{c.locality}}</td> -->
      <!-- <td>{{c.srctype}}({{c.srcdesc}})|
        Begin Date
      </td>
      <td></td> -->
      <!-- <td>{{c.area}}</td> -->
      <td>{{c.locality}}</td>
      <td data-testid="cust-segment">
        <span class="badge" [ngClass]="{'bg-success': c.segment === 'Chronic only', 'bg-info text-dark': c.segment === 'OTC only', 'bg-primary': c.segment === 'OTC + Chronic', 'bg-secondary': c.segment === 'Other', 'bg-light text-muted border': c.segment === 'No purchases'}">{{c.segment}}</span>
      </td>
      <!-- <td>{{c.address}}</td> -->
      <!-- <td>{{c.srctype}}</td> -->
      <!-- <td>{{c.srcdesc}}</td> -->
      <!-- <td>{{c.createdon | date : 'dd/MM/yy'}}</td> -->
      <td class="text-center">
        <div class="grid-actions">
          <a [routerLink]="['../edit',c.id]" title="Edit"><i class="bi bi-pencil-square text-primary"></i></a>
        </div>
      </td>
    </tr>
</ng-template>
</p-table>
