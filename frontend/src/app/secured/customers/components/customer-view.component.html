<div *ngIf="hasFacts" class="hist-strip" data-testid="cust-strip">
    <span *ngIf="customer.altmobile" title="Other mobile"><i class="bi bi-telephone"></i>{{customer.altmobile}}</span>
    <span *ngIf="customer.email" title="Email"><i class="bi bi-envelope"></i>{{customer.email}}</span>
    <span *ngIf="customer.locality" title="Locality"><i class="bi bi-geo-alt"></i>{{customer.locality}}</span>
    <span *ngIf="customer.address" title="Address"><i class="bi bi-house-door"></i>{{customer.address}}</span>
    <span *ngIf="customer.srctype" title="How they found us"><i class="bi bi-link-45deg"></i>{{customer.srctype}}<span *ngIf="customer.srcdesc"> ({{customer.srcdesc}})</span></span>
</div>
<p-tabView>
    <p-tabPanel header="Orders">
        <app-customer-orders [customer]="customer" (selected)="productsSelected($event)"></app-customer-orders>
    </p-tabPanel>
    <p-tabPanel header="Store credit">
        <app-customer-credit [customerId]="id"></app-customer-credit>
    </p-tabPanel>
    <p-tabPanel header="Documents">
        <app-customer-documents [customer]="customer" (selected)="documentsSelected($event)"></app-customer-documents>
    </p-tabPanel>
</p-tabView>
