<app-document-upload [entity]="customer" [type]="'customer'" [property]="'id'"
[copyProps]="copyProps"
(uploaded)="onUpload($event)"></app-document-upload>
<app-document-list [ids]="ids" [loading]="loading" copyLabel="Add to this bill" (selected)="copySelectedItem($event)" (removed)="removedSelectedItem($event)"></app-document-list>
