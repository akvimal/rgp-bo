<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGP Control Plane</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --mute:#6b7488; --line:#e3e6ee; --brand:#3b4cca; --ok:#1f8f4e; --warn:#b7791f; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151d; --card:#1b2030; --ink:#e8ecf5; --mute:#97a0b5; --line:#2a3145; --brand:#7c8cff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; } h2 { font-size: 16px; margin: 0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  table { width:100%; border-collapse: collapse; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { color:var(--mute); font-weight:600; font-size:12px; }
  input, select, button, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  button { cursor:pointer; background:var(--brand); color:#fff; border-color:var(--brand); } button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button.danger { background:var(--bad); border-color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; } .row > label { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--mute); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .pill.active { color:var(--ok); border-color:var(--ok); } .pill.trial { color:var(--warn); border-color:var(--warn); } .pill.suspended, .pill.closed { color:var(--bad); border-color:var(--bad); }
  .msg { padding:8px 10px; border-radius:6px; margin:8px 0; background:var(--bg); border:1px solid var(--line); } .msg.err { border-color:var(--bad); color:var(--bad); }
  .mute { color:var(--mute); } code, pre { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:1px 4px; } pre { padding:8px; overflow:auto; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>RGP Control Plane</h1>

  <div id="login" class="card hide">
    <h2>Sign in</h2>
    <div class="row">
      <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
      <button id="signin">Sign in</button>
    </div>
    <div id="loginmsg" class="msg err hide"></div>
  </div>

  <div id="app" class="hide">
    <div id="flash" class="msg hide"></div>

    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">Customers</h2>
        <div class="row">
          <label>Show<select id="f-kind"><option value="">Everyone</option><option value="customers">Customers</option><option value="demos">Demos</option></select></label>
          <button class="ghost" id="purge">Delete closed demos</button>
        </div>
      </div>
      <table id="tenants"><thead><tr><th>Name</th><th>Plan</th><th>Status</th><th>Port</th><th>Use (stores / users / uploads / scans)</th><th>Last seen</th><th></th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
      <h2>New customer</h2>
      <div class="row">
        <label>Name (for the URL)<input id="n-slug" placeholder="sharma-pharmacy" size="18"></label>
        <label>Business name<input id="n-name" placeholder="Sharma Pharmacy" size="20"></label>
        <label>Owner's name<input id="n-owner" size="16"></label>
        <label>Owner's email<input id="n-email" type="email" size="22"></label>
        <label>Plan<select id="n-plan"></select></label>
        <label>Shop type<select id="n-preset"><option value="">Business Head login</option><option value="solo">Just me (Owner-operator login)</option></select></label>
        <label>Trial days<input id="n-trial" type="number" value="14" min="0" max="365" style="width:70px"></label>
        <label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input id="n-demo" type="checkbox"> Demo with sample data</label>
        <button id="create">Create</button>
      </div>
      <div class="mute" id="tmpl" style="margin-top:6px"></div>
      <div id="created" class="msg hide"></div>
    </div>

    <div class="card">
      <h2>Plans</h2>
      <table id="plans"><thead><tr><th>Plan</th><th>Stores</th><th>Users</th><th>Uploads (blank = unlimited)</th><th>Scans / month</th><th>Price / month</th><th>Modules</th><th></th></tr></thead><tbody></tbody></table>
    </div>

    <div id="detail" class="card hide"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('cp_token') || '';
let plans = [];

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const text = await r.text();
  let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (r.status === 401 && path !== '/admin/login') { token = ''; sessionStorage.removeItem('cp_token'); show(); throw new Error('Signed out.'); }
  if (!r.ok) throw new Error((data && data.message) ? [].concat(data.message).join(' ') : ('Error ' + r.status));
  return data;
}
function flash(text, err) { const f = $('flash'); f.textContent = text; f.className = 'msg' + (err ? ' err' : ''); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function show() { $('login').classList.toggle('hide', !!token); $('app').classList.toggle('hide', !token); if (token) refresh(); }

$('signin').onclick = async () => {
  try { const r = await api('POST', '/admin/login', { password: $('pw').value }); token = r.token; sessionStorage.setItem('cp_token', token); $('pw').value = ''; show(); }
  catch (e) { $('loginmsg').textContent = e.message; $('loginmsg').classList.remove('hide'); }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('signin').click(); });

async function refresh() {
  try {
    plans = await api('GET', '/plans');
    $('n-plan').innerHTML = plans.map((p) => `<option value="${esc(p.key)}">${esc(p.label)}</option>`).join('');
    $('plans').querySelector('tbody').innerHTML = plans.map((p) => `<tr data-plan="${esc(p.key)}">
      <td>${esc(p.label)}</td>
      <td><input class="p-stores" type="number" min="1" value="${p.max_stores}" style="width:70px"></td>
      <td><input class="p-users" type="number" min="1" value="${p.max_users}" style="width:70px"></td>
      <td><input class="p-docs" type="number" min="0" value="${p.max_documents ?? ''}" placeholder="unlimited" style="width:90px"></td>
      <td><input class="p-scans" type="number" min="0" value="${p.max_scans ?? ''}" placeholder="unlimited" style="width:90px"></td>
      <td><input class="p-price" type="number" min="0" value="${p.price_month ?? ''}" placeholder="not set" style="width:100px"></td>
      <td class="mute">${Object.entries(p.modules).map(([k, v]) => v === true ? k : (v === false ? '' : k + ':' + v)).filter(Boolean).join(', ')}</td>
      <td><button class="ghost p-save">Save</button></td></tr>`).join('');
    document.querySelectorAll('.p-save').forEach((b) => b.onclick = async () => {
      const tr = b.closest('tr');
      try { await api('PUT', '/plans/' + tr.dataset.plan, { max_stores: tr.querySelector('.p-stores').value, max_users: tr.querySelector('.p-users').value, max_documents: tr.querySelector('.p-docs').value === '' ? null : tr.querySelector('.p-docs').value, max_scans: tr.querySelector('.p-scans').value === '' ? null : tr.querySelector('.p-scans').value, price_month: tr.querySelector('.p-price').value === '' ? null : tr.querySelector('.p-price').value }); flash('Plan saved.'); refresh(); }
      catch (e) { flash(e.message, true); }
    });
    const tm = await api('GET', '/demo-template');
    $('tmpl').textContent = tm.exists ? 'Demo template ready (built ' + new Date(tm.builtOn).toLocaleString() + ', ' + Math.round(tm.bytes / 1024) + ' KB). Rebuild it now and then so the sample dates stay recent.' : 'No demo template yet: run scripts/demo-template-build.sh before creating a demo.';
    let rows = await api('GET', '/tenants');
    const kind = $('f-kind').value;
    if (kind === 'demos') rows = rows.filter((t) => t.is_demo); else if (kind === 'customers') rows = rows.filter((t) => !t.is_demo);
    $('tenants').querySelector('tbody').innerHTML = rows.length ? rows.map((t) => {
      const st = t.effective.status; const u = t.usage || {};
      return `<tr><td><b>${esc(t.name)}</b>${t.is_demo ? ' <span class="pill trial">demo</span>' : ''}<div class="mute">${esc(t.slug)}</div></td><td>${esc(t.plan_label)}</td>
        <td><span class="pill ${esc(st)}">${esc(st)}</span>${t.effective.reason === 'trial_ended' ? '<div class="mute">trial ended</div>' : (t.status === 'trial' && t.trial_ends ? '<div class="mute">trial to ' + esc(String(t.trial_ends).slice(0, 10)) + '</div>' : '')}</td>
        <td>${t.web_port}</td><td>${u.stores ?? '-'} / ${u.users ?? '-'} / ${u.documents ?? '-'} / ${u.scans_month ?? '-'}</td><td class="mute">${t.last_seen ? new Date(t.last_seen).toLocaleString() : 'never'}</td>
        <td><button class="ghost" data-open="${esc(t.slug)}">Manage</button></td></tr>`;
    }).join('') : '<tr><td colspan="7" class="mute">No customers yet.</td></tr>';
    document.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => detail(b.dataset.open));
  } catch (e) { flash(e.message, true); }
}

$('f-kind').onchange = () => refresh();
$('purge').onclick = async () => {
  if (!confirm('Delete the database and record of every CLOSED demo? This cannot be undone.')) return;
  try { const r = await api('DELETE', '/demos/closed?confirm=DELETE'); flash(r.deleted.length ? 'Deleted: ' + r.deleted.join(', ') : 'No closed demos to delete.'); refresh(); } catch (e) { flash(e.message, true); }
};

$('create').onclick = async () => {
  try {
    const demo = $('n-demo').checked;
    const r = await api('POST', '/tenants', { slug: $('n-slug').value, name: $('n-name').value, ownerName: $('n-owner').value, ownerEmail: $('n-email').value, plan: $('n-plan').value, preset: $('n-preset').value, trialDays: Number($('n-trial').value), demo });
    const c = $('created'); c.className = 'msg';
    c.innerHTML = `<b>Created.</b> Owner login: <code>${esc(r.login.email)}</code> password <code>${esc(r.login.password)}</code> (${demo ? 'kept, so you can see it again under Manage' : 'shown once'}; ${esc(r.login.role)}).` +
      (r.users ? `<br>Sample logins (same password): ${r.users.map((u) => '<code>' + esc(u.email) + '</code> ' + esc(u.role)).join(', ')}` : '') + `<br>${esc(r.next)}`;
    refresh();
  } catch (e) { const c = $('created'); c.className = 'msg err'; c.textContent = e.message; }
};

async function detail(slug) {
  try {
    const t = await api('GET', '/tenants/' + slug);
    const d = $('detail'); d.classList.remove('hide');
    const e = t.entitlements;
    d.innerHTML = `<h2>${esc(t.name)} <span class="mute">(${esc(t.slug)})</span></h2>
      <div class="row">
        <label>Plan<select id="d-plan">${plans.map((p) => `<option value="${esc(p.key)}" ${p.key === t.plan ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}</select></label>
        <label>Trial ends<input id="d-trial" type="date" value="${t.trial_ends ? String(t.trial_ends).slice(0, 10) : ''}"></label>
        <label>Stores (blank = plan)<input id="d-stores" type="number" min="1" value="${t.max_stores ?? ''}" style="width:90px"></label>
        <label>Users (blank = plan)<input id="d-users" type="number" min="1" value="${t.max_users ?? ''}" style="width:90px"></label>
        <label>Uploads (blank = plan / cap)<input id="d-docs" type="number" min="0" value="${t.max_documents ?? ''}" style="width:90px"></label>
        <label>Scans a month (blank = plan / cap)<input id="d-scans" type="number" min="0" value="${t.max_scans ?? ''}" style="width:90px"></label>
        <button id="d-save">Save</button>
        ${t.status === 'suspended' || t.status === 'trial' ? '<button id="d-activate">Activate</button>' : ''}
        ${t.status !== 'suspended' && t.status !== 'closed' ? '<button class="ghost" id="d-suspend">Suspend</button>' : ''}
        ${t.status !== 'closed' ? '<button class="danger" id="d-close">Close</button>' : ''}
      </div>
      <p class="mute">The app is told: status <b>${esc(e.status)}</b>${e.reason ? ' (' + esc(e.reason) + ')' : ''}, up to ${e.limits.stores} store(s) and ${e.limits.users} user(s), ${e.limits.documents ?? 'unlimited'} uploaded document(s) and ${e.limits.scans ?? 'unlimited'} invoice or statement read(s) a month. Modules on: ${esc(Object.entries(e.modules).map(([k, v]) => v === true ? k : (v === false ? '' : k + ':' + v)).filter(Boolean).join(', ') || 'none')}.</p>
      <div class="row"><label>Module grants for this customer only (JSON, e.g. {"gst":true})<input id="d-grants" size="50" value='${esc(JSON.stringify(t.grants || {}))}'></label></div>
      ${t.is_demo ? `<div class="msg"><b>Demo.</b> Sign in at <code>http://localhost:${t.web_port}</code> as <code>${esc(t.owner_email)}</code>, password <code>${esc(t.demo_password || '')}</code>. All sample logins use that password.
        <div class="row" style="margin-top:6px"><button id="d-reset" class="ghost">Reset to sample data</button><button id="d-extend" class="ghost">Add 14 days</button></div></div>` : ''}
      <p class="mute">Start or restart their app on the server: <code>scripts/tenant-up.sh ${esc(t.slug)}</code> (port ${t.web_port}).</p>
      <h2>History</h2><table><tbody>${t.events.map((x) => `<tr><td class="mute">${new Date(x.at).toLocaleString()}</td><td>${esc(x.action)}</td></tr>`).join('')}</tbody></table>`;
    const act = (fn) => async () => { try { await fn(); flash('Done.'); refresh(); detail(slug); } catch (er) { flash(er.message, true); } };
    $('d-save').onclick = act(async () => api('PUT', '/tenants/' + slug, { plan: $('d-plan').value, trial_ends: $('d-trial').value || null, max_stores: $('d-stores').value || null, max_users: $('d-users').value || null, max_documents: $('d-docs').value === '' ? null : $('d-docs').value, max_scans: $('d-scans').value === '' ? null : $('d-scans').value, grants: JSON.parse($('d-grants').value || '{}') }));
    if ($('d-reset')) $('d-reset').onclick = act(() => { if (!confirm('Replace everything in this demo with the sample data?')) throw new Error('Cancelled.'); return api('POST', '/tenants/' + slug + '/reset'); });
    if ($('d-extend')) $('d-extend').onclick = act(() => api('POST', '/tenants/' + slug + '/extend', { days: 14 }));
    if ($('d-activate')) $('d-activate').onclick = act(() => api('POST', '/tenants/' + slug + '/activate'));
    if ($('d-suspend')) $('d-suspend').onclick = act(() => api('POST', '/tenants/' + slug + '/suspend'));
    if ($('d-close')) $('d-close').onclick = act(() => { if (!confirm('Close ' + slug + '? Their app stops working. Data is kept until you delete it.')) throw new Error('Cancelled.'); return api('POST', '/tenants/' + slug + '/close'); });
    d.scrollIntoView({ behavior: 'smooth' });
  } catch (er) { flash(er.message, true); }
}
show();
</script>
</body>
</html>
