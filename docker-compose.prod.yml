
services:
  api:
    build:
      dockerfile: Dockerfile
      context: ./api-v2
    restart: unless-stopped
    volumes:
      - ${UPLOADS_PATH:-~/uploads}:/app/upload
    command: npm run start:prod
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@${DB_HOST:?Set DB_HOST to the existing Postgres host}:${DB_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB}
      LOG_SQL: ${LOG_SQL:-false}
      EXPIRY_THRESHOLD_DAYS: ${EXPIRY_THRESHOLD_DAYS:-0}
      FILEUPLOAD_LOCATION: ${FILEUPLOAD_LOCATION:-/app/upload}
      FILEUPOAD_SIZE_LIMIT: ${FILEUPOAD_SIZE_LIMIT:-512000}
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY}
      JWT_EXPIRES: ${JWT_EXPIRES:-24h}
      PORT: ${API_PORT:-3000}
    expose:
      - "${API_PORT:-3000}"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:process.env.PORT||3000,path:'/'},res=>process.exit(res.statusCode < 500 ? 0 : 1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      dockerfile: Dockerfile.prod
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
